name: CI
on: push

permissions: {}

jobs:
  test-base:
    strategy:
      matrix:
        alpine:
          - latest-stable
          - edge
          - v3.10  # some old branch
        arch:
          - x86_64
          - aarch64  # emulated
        host-os:
          - ubuntu-latest
          - ubuntu-24.04
          - ubuntu-22.04
    runs-on: ${{ matrix.host-os }}
    env:
      MY_JOB_VAR: 'allons-y!'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Alpine Linux ${{ matrix.alpine }} ${{ matrix.arch }}
        uses: ./
        with:
          arch: ${{ matrix.arch }}
          branch: ${{ matrix.alpine }}
          packages: build-base
        id: setup-alpine

      - name: Output environment
        run: |
          uname -a
          cat /etc/os-release
          env
        shell: alpine.sh {0}

      - name: Prepare environment
        run: printf '%s\n' 'export MY_PROFILE_VAR=42' | tee -a ~/.profile > /dev/null
        shell: alpine.sh {0}

      - name: Check that default working directory is the workspace
        env:
          EXPECTED_WORKSPACE: ${{ github.workspace }}
        run: |
          pwd
          test "$(pwd)" = "$EXPECTED_WORKSPACE"
        shell: alpine.sh {0}

      - name: Check that default environment variables are available
        env:
          EXPECTED_WORKSPACE: ${{ github.workspace }}
        run: |
          echo "$GITHUB_WORKSPACE"
          test "$GITHUB_WORKSPACE" = "$EXPECTED_WORKSPACE"
        shell: alpine.sh {0}

      - name: Check that job environment variables are available
        env:
          EXPECTED_MY_JOB_VAR: ${{ env.MY_JOB_VAR }}
        run: |
          echo "$MY_JOB_VAR"
          test "$MY_JOB_VAR" = "$EXPECTED_MY_JOB_VAR"
        shell: alpine.sh {0}

      - name: Check that ~/.profile is being sourced
        run: |
          echo "$MY_PROFILE_VAR"
          test "$MY_PROFILE_VAR" = 42
        shell: alpine.sh {0}

      - name: Check that 'uname -m' returns ${{ matrix.arch }}
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          uname -m
          test "$(uname -m)" = "$EXPECTED_ARCH"
        shell: alpine.sh {0}

      - name: Check that $USER is 'runner' when shell is 'alpine.sh {0}'
        run: |
          id -un
          test "$(id -un)" = 'runner'
        shell: alpine.sh {0}

      - name: Check that $USER is 'root' when shell is 'alpine.sh --root {0}'
        run: |
          id -un
          test "$(id -un)" = 'root'
        shell: alpine.sh --root {0}

      - name: Check that steps.<step>.outputs.root-path is set and points to the chroot dir
        env:
          ALPINE_ROOT_PATH: ${{ steps.setup-alpine.outputs.root-path }}
        run: test -f "$ALPINE_ROOT_PATH"/etc/alpine-release

      - name: Check that apk works
        run: apk add ruby
        shell: alpine.sh --root {0}

  test-multi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install latest Alpine Linux x86_64
        uses: ./
        with:
          arch: x86_64
          shell-name: alpine-x86_64.sh
        id: alpine-x86_64

      - name: Install latest Alpine Linux aarch64
        uses: ./
        with:
          arch: aarch64
          shell-name: alpine-aarch64.sh
          volumes: ${{ steps.alpine-x86_64.outputs.root-path }}:/mnt/alpine-x86_64

      - name: Check that shell 'alpine-x86_64.sh {0}' is x86_64
        run: |
          uname -m
          test "$(uname -m)" = 'x86_64'
        shell: alpine-x86_64.sh {0}

      - name: Check that shell 'alpine-aarch64.sh {0}' is aarch64
        run: |
          uname -m
          test "$(uname -m)" = 'aarch64'
        shell: alpine-aarch64.sh {0}

      - name: Check that x86_64 chroot is bind in aarch64 chroot
        run: test -f /mnt/alpine-x86_64/etc/alpine-release
        shell: alpine-aarch64.sh {0}
