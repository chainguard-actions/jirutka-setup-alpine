name: Test Alpine setup with custom shell name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          branch: latest-stable
          arch: x86_64
          shell-name: myalpine.sh

      - name: Assert action outcome and outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ROOT_PATH: ${{ steps.action.outputs.root-path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "root-path: $ROOT_PATH"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ROOT_PATH" ]; then
              echo "FAIL: action succeeded but root-path output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with root-path=$ROOT_PATH"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in restricted act environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert custom shell wrapper exists in chroot abin (when action succeeded)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ROOT_PATH: ${{ steps.action.outputs.root-path }}
        run: |
          if [ "$OUTCOME" != "success" ]; then
            echo "SKIP: action did not succeed, skipping custom shell wrapper check"
            exit 0
          fi
          if [ ! -f "$ROOT_PATH/abin/myalpine.sh" ]; then
            echo "FAIL: custom shell wrapper myalpine.sh not found in $ROOT_PATH/abin/"
            ls "$ROOT_PATH/abin/" || true
            exit 1
          fi
          echo "PASS: custom shell wrapper myalpine.sh exists"

      - name: Assert default alpine.sh does NOT exist when custom name is used (when action succeeded)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ROOT_PATH: ${{ steps.action.outputs.root-path }}
        run: |
          if [ "$OUTCOME" != "success" ]; then
            echo "SKIP: action did not succeed, skipping default shell name check"
            exit 0
          fi
          if [ -f "$ROOT_PATH/abin/alpine.sh" ]; then
            echo "FAIL: default alpine.sh should not exist when custom shell-name is set"
            exit 1
          fi
          echo "PASS: default alpine.sh does not exist (correct)"
