name: Test Alpine setup with invalid inputs (error handling)
on:
  workflow_dispatch:
jobs:
  test-invalid-arch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          arch: invalid-arch
          branch: latest-stable

      - name: Assert action failed with invalid arch
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed with invalid arch"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed with invalid arch but succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

  test-invalid-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          arch: x86_64
          branch: not-a-valid-branch

      - name: Assert action failed with invalid branch
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed with invalid branch"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed with invalid branch but succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
