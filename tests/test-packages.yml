name: Test Alpine setup with packages
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          branch: latest-stable
          arch: x86_64
          packages: curl git

      - name: Assert action outcome and outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ROOT_PATH: ${{ steps.action.outputs.root-path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "root-path: $ROOT_PATH"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ROOT_PATH" ]; then
              echo "FAIL: action succeeded but root-path output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with root-path=$ROOT_PATH"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in restricted act environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert curl is installed in chroot (when action succeeded)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ROOT_PATH: ${{ steps.action.outputs.root-path }}
        run: |
          if [ "$OUTCOME" != "success" ]; then
            echo "SKIP: action did not succeed, skipping curl check"
            exit 0
          fi
          if [ ! -f "$ROOT_PATH/usr/bin/curl" ]; then
            echo "FAIL: curl not found in chroot at $ROOT_PATH/usr/bin/curl"
            exit 1
          fi
          echo "PASS: curl is installed in chroot"

      - name: Assert git is installed in chroot (when action succeeded)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ROOT_PATH: ${{ steps.action.outputs.root-path }}
        run: |
          if [ "$OUTCOME" != "success" ]; then
            echo "SKIP: action did not succeed, skipping git check"
            exit 0
          fi
          if [ ! -f "$ROOT_PATH/usr/bin/git" ]; then
            echo "FAIL: git not found in chroot at $ROOT_PATH/usr/bin/git"
            exit 1
          fi
          echo "PASS: git is installed in chroot"
