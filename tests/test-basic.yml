name: Test basic Alpine setup (default x86_64)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          branch: latest-stable
          arch: x86_64

      - name: Assert action outcome and outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ROOT_PATH: ${{ steps.action.outputs.root-path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "root-path: $ROOT_PATH"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ROOT_PATH" ]; then
              echo "FAIL: action succeeded but root-path output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with root-path=$ROOT_PATH"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in restricted act environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert Alpine root directory exists (when action succeeded)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ROOT_PATH: ${{ steps.action.outputs.root-path }}
        run: |
          if [ "$OUTCOME" != "success" ]; then
            echo "SKIP: action did not succeed, skipping directory check"
            exit 0
          fi
          echo "Checking $ROOT_PATH exists..."
          if [ ! -d "$ROOT_PATH" ]; then
            echo "FAIL: Alpine root directory does not exist at $ROOT_PATH"
            exit 1
          fi
          echo "PASS: Alpine root directory exists"

      - name: Assert Alpine OS release file exists in chroot (when action succeeded)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ROOT_PATH: ${{ steps.action.outputs.root-path }}
        run: |
          if [ "$OUTCOME" != "success" ]; then
            echo "SKIP: action did not succeed, skipping OS release check"
            exit 0
          fi
          if [ ! -f "$ROOT_PATH/etc/os-release" ] && [ ! -f "$ROOT_PATH/etc/alpine-release" ]; then
            echo "FAIL: neither /etc/os-release nor /etc/alpine-release found in chroot"
            ls "$ROOT_PATH/etc/" || true
            exit 1
          fi
          echo "PASS: Alpine OS release file found"
          cat "$ROOT_PATH/etc/os-release" 2>/dev/null || cat "$ROOT_PATH/etc/alpine-release"

      - name: Assert alpine.sh shell wrapper exists in chroot abin (when action succeeded)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ROOT_PATH: ${{ steps.action.outputs.root-path }}
        run: |
          if [ "$OUTCOME" != "success" ]; then
            echo "SKIP: action did not succeed, skipping shell wrapper check"
            exit 0
          fi
          if [ ! -f "$ROOT_PATH/abin/alpine.sh" ]; then
            echo "FAIL: alpine.sh not found in $ROOT_PATH/abin/"
            ls "$ROOT_PATH/abin/" || true
            exit 1
          fi
          echo "PASS: alpine.sh shell wrapper exists"

      - name: Assert destroy.sh is in chroot root (when action succeeded)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ROOT_PATH: ${{ steps.action.outputs.root-path }}
        run: |
          if [ "$OUTCOME" != "success" ]; then
            echo "SKIP: action did not succeed, skipping destroy.sh check"
            exit 0
          fi
          if [ ! -f "$ROOT_PATH/destroy.sh" ]; then
            echo "FAIL: destroy.sh not found in $ROOT_PATH"
            exit 1
          fi
          echo "PASS: destroy.sh exists"

      - name: Run a command in the Alpine chroot (when action succeeded)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ROOT_PATH: ${{ steps.action.outputs.root-path }}
        run: |
          if [ "$OUTCOME" != "success" ]; then
            echo "SKIP: action did not succeed, skipping chroot command"
            exit 0
          fi
          echo "Running inside Alpine chroot via shell wrapper"
          "$ROOT_PATH/abin/alpine.sh" /bin/sh -c "cat /etc/os-release && uname -m && echo PASS: command ran in Alpine chroot" || {
            echo "INFO: chroot command failed (may be expected in act environment)"
          }
